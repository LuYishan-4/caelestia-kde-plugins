name: Build index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-index:
    name: Regenerate index.json
    runs-on: ubuntu-latest
    # The commit made by this job uses GITHUB_TOKEN and therefore does not
    # re-trigger workflows, but keep this guard as an extra safety net.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: python -m pip install jsonschema

      - name: Regenerate index.json
        run: python scripts/build_index.py

      - name: Commit regenerated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json unchanged; nothing to commit"
          else
            git commit -m "chore: regenerate index.json"
            git push
          fi
